# dsh bundle patch: inserts this plugin into a profile's layer stack.
#
# The config is intentionally EMPTY: baseURL / model / apiKeyEnv /
# candidateModels are all derived at search time from dsh's ACTIVE model
# configuration (the same gateway and model pool the chat uses), so no proxy
# URL or model id is baked in. Set a field here — or in the profile's own
# cordis.patch.yml / the harness Settings UI — only to override the derivation.
- insert:
    - id: litellm-responses-search
      name: 'dsh-web-search-litellm'
      config: {}
