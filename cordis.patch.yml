# dsh bundle patch: inserts this plugin into a profile's layer stack.
#
# This is a PLAIN insert — only `id` + `name`, no `config`, no expressions —
# so the market's hot-mount parser can activate it live without a restart.
#
# The plugin config is intentionally empty and derived at search time from
# dsh's ACTIVE model configuration (same gateway and model pool as the chat):
# baseURL / model / apiKeyEnv / candidateModels all default to the active
# provider/model. Set them only in the profile's own cordis.patch.yml or the
# harness Settings UI to override the derivation.
- insert:
    - id: litellm-responses-search
      name: 'dsh-web-search-litellm'
